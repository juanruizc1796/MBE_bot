services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mbe-backend:latest
    restart: unless-stopped
    volumes:
      # FAISS index + CSV en modo lectura
      - ./rag_engine/data:/app/rag_engine/data:ro
      # Logs con escritura habilitada (sobre-monta el subpath anterior)
      - ./rag_engine/data/logs:/app/rag_engine/data/logs
      # Usuarios para autenticacion (editable sin rebuild)
      - ./rag_engine/users.yaml:/app/rag_engine/users.yaml:ro
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: mbe-frontend:latest
    restart: unless-stopped
    environment:
      # URL interna del backend en la red de Docker (no la URL pública:
      # el navegador nunca le habla al backend directamente, solo a
      # través de las rutas /api/* del propio Next.js).
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:

